<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículos de Ocasión — Autosucro</title>
  <meta name="description" content="Catálogo completo de vehículos seminuevos y de ocasión en Autosucro. Revisados con garantía de 12 meses.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="header-container"></div>

<div class="page-hero" data-text="VEHÍCULOS">
  <div class="page-hero-inner">
    <p class="page-hero-eyebrow">Catálogo completo</p>
    <h1 class="page-hero-title">Vehículos de <em>ocasión</em></h1>
  </div>
</div>

<section class="catalog-section">
  <div class="catalog-layout">

    <!-- SIDEBAR -->
    <aside class="catalog-sidebar">
      <div class="sidebar-filters">

        <div class="sf-header">
          <p class="sf-title">Filtros</p>
          <button type="button" class="sf-reset" id="filterReset">Limpiar</button>
        </div>

        <!-- Search -->
        <div class="sf-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="sf-search" id="searchInput" placeholder="Marca o modelo…">
        </div>

        <!-- Estado -->
        <div class="sf-group">
          <p class="sf-label">Estado</p>
          <div class="sf-chips" id="chipsStatus">
            <button class="sf-chip sf-chip-active" data-val="">Todos</button>
            <button class="sf-chip" data-val="available">Disponibles</button>
            <button class="sf-chip" data-val="sold">Vendidos</button>
          </div>
        </div>

        <!-- Combustible -->
        <div class="sf-group">
          <p class="sf-label">Combustible</p>
          <div class="sf-chips" id="chipsFuel">
            <button class="sf-chip sf-chip-active" data-val="">Todos</button>
            <button class="sf-chip" data-val="Gasolina">Gasolina</button>
            <button class="sf-chip" data-val="Diesel">Diesel</button>
            <button class="sf-chip" data-val="Híbrido">Híbrido</button>
            <button class="sf-chip" data-val="Eléctrico">Eléctrico</button>
          </div>
        </div>

        <!-- Cambio -->
        <div class="sf-group">
          <p class="sf-label">Cambio</p>
          <div class="sf-chips" id="chipsTransmission">
            <button class="sf-chip sf-chip-active" data-val="">Todos</button>
            <button class="sf-chip" data-val="Manual">Manual</button>
            <button class="sf-chip" data-val="Automático">Automático</button>
          </div>
        </div>

        <!-- Precio -->
        <div class="sf-group">
          <div class="sf-price-header">
            <p class="sf-label">Precio máximo</p>
            <span class="sf-price-val" id="priceDisplay">Sin límite</span>
          </div>
          <div class="sf-range-wrap">
            <input type="range" class="sf-range" id="filterPrice" min="0" max="40000" step="500" value="40000">
            <div class="sf-range-track" id="rangeTrack"></div>
          </div>
          <div class="sf-range-labels">
            <span>0 €</span>
            <span>40.000 €</span>
          </div>
        </div>

        <!-- Marca -->
        <div class="sf-group">
          <p class="sf-label">Marca</p>
          <div class="sf-chips sf-chips-wrap" id="chipsBrand"></div>
        </div>

        <div class="sf-count-wrap">
          <span class="sf-count" id="filterCount"></span>
        </div>

      </div>
    </aside>

    <!-- GRID -->
    <div class="catalog-content">
      <div class="vehicles-grid" id="vehiclesGrid"></div>
    </div>

  </div>
</section>

<div class="modal-overlay" id="vehicleModal" onclick="if(event.target===this)closeVehicleModal()">
  <div class="modal" id="vehicleModalContent"></div>
</div>

<div id="footer-container"></div>
<script src="js/vehicles-data.js"></script>
<script src="js/components.js"></script>
<script>
  document.getElementById('header-container').innerHTML = renderHeader('Vehículos');
  document.getElementById('footer-container').innerHTML = renderFooter();
  initMobileNav();

  // ── Estado único ────────────────────────────────────────────────
  var state = { search: '', brand: '', fuel: '', transmission: '', maxPrice: Infinity, status: '' };

  // ── Chips: activar uno y desactivar el resto ─────────────────────
  function activarChip(containerId, valor) {
    var c = document.getElementById(containerId);
    if (!c) return;
    c.querySelectorAll('.sf-chip').forEach(function(btn) {
      btn.classList.toggle('sf-chip-active', btn.dataset.val === valor);
    });
  }

  function setupChipGroup(containerId, stateKey) {
    var c = document.getElementById(containerId);
    if (!c) return;
    c.addEventListener('click', function(e) {
      var chip = e.target.closest('.sf-chip');
      if (!chip) return;
      var nuevo = (state[stateKey] === chip.dataset.val && chip.dataset.val !== '')
                  ? ''              // clic en el ya activo → deseleccionar
                  : chip.dataset.val;
      state[stateKey] = nuevo;
      activarChip(containerId, nuevo);
      aplicarFiltros();
    });
  }

  setupChipGroup('chipsStatus',       'status');
  setupChipGroup('chipsFuel',         'fuel');
  setupChipGroup('chipsTransmission', 'transmission');
  setupChipGroup('chipsBrand',        'brand');

  // ── Marcas: generar chips dinámicamente ─────────────────────────
  var todasMarcas = [...new Set(getVehicles().map(function(v){ return v.brand; }))].sort();
  var brandContainer = document.getElementById('chipsBrand');
  var todosBtn = document.createElement('button');
  todosBtn.type = 'button';
  todosBtn.className = 'sf-chip sf-chip-active';
  todosBtn.dataset.val = '';
  todosBtn.textContent = 'Todos';
  brandContainer.appendChild(todosBtn);
  todasMarcas.forEach(function(b) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sf-chip';
    btn.dataset.val = b;
    btn.textContent = b;
    brandContainer.appendChild(btn);
  });

  // ── Buscador ─────────────────────────────────────────────────────
  var searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', function() {
    state.search = searchInput.value.toLowerCase().trim();
    aplicarFiltros();
  });

  // ── Slider de precio ─────────────────────────────────────────────
  var priceInput   = document.getElementById('filterPrice');
  var priceDisplay = document.getElementById('priceDisplay');
  var rangeTrack   = document.getElementById('rangeTrack');

  function actualizarSlider() {
    var val = parseInt(priceInput.value);
    var pct = (val / 40000) * 100;
    rangeTrack.style.width = pct + '%';
    state.maxPrice = val >= 40000 ? Infinity : val;
    priceDisplay.textContent = val >= 40000 ? 'Sin límite' : val.toLocaleString('es-ES') + ' €';
    aplicarFiltros();
  }
  priceInput.addEventListener('input', actualizarSlider);
  actualizarSlider();

  // ── LIMPIAR ───────────────────────────────────────────────────────
  document.getElementById('filterReset').addEventListener('click', function() {
    // 1. Resetear estado
    state.search       = '';
    state.brand        = '';
    state.fuel         = '';
    state.transmission = '';
    state.status       = '';
    state.maxPrice     = Infinity;
    // 2. Resetear buscador
    searchInput.value = '';
    // 3. Resetear slider
    priceInput.value         = 40000;
    rangeTrack.style.width   = '100%';
    priceDisplay.textContent = 'Sin límite';
    // 4. Resetear todos los chips a "Todos"
    activarChip('chipsStatus',       '');
    activarChip('chipsFuel',         '');
    activarChip('chipsTransmission', '');
    activarChip('chipsBrand',        '');
    // 5. Renderizar con todo limpio
    aplicarFiltros();
  });

  // ── Renderizar grid ───────────────────────────────────────────────
  var primeraVez = true;

  function aplicarFiltros() {
    var filtrados = getVehicles().filter(function(v) {
      if (state.search) {
        var texto = (v.brand + ' ' + v.model + ' ' + v.year).toLowerCase();
        if (texto.indexOf(state.search) === -1) return false;
      }
      if (state.brand        && v.brand        !== state.brand)        return false;
      if (state.fuel         && v.fuel         !== state.fuel)         return false;
      if (state.transmission && v.transmission !== state.transmission) return false;
      if (state.maxPrice < Infinity && v.price > state.maxPrice)       return false;
      if (state.status === 'available' && v.sold)  return false;
      if (state.status === 'sold'      && !v.sold) return false;
      return true;
    });

    document.getElementById('filterCount').textContent =
      filtrados.length + ' vehículo' + (filtrados.length !== 1 ? 's' : '');

    var grid = document.getElementById('vehiclesGrid');
    grid.innerHTML = filtrados.length
      ? filtrados.map(function(v){ return renderVehicleCard(v); }).join('')
      : '<div class="no-results" style="opacity:1;transform:none;transition:none">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
        + '<p class="no-results-title">Sin resultados</p>'
        + '<p class="no-results-text">Prueba a cambiar los filtros o <a href="contacto.html" style="color:var(--brand);font-weight:600">contáctanos</a>.</p>'
        + '</div>';

    if (primeraVez) { primeraVez = false; if (window.animRefresh) window.animRefresh(); }
  }

  aplicarFiltros();
</script>
<script src="js/animations.js"></script>
</body>
</html>
